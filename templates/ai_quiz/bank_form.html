{% extends "base.html" %}
{% block page_title %}Add to the question bank{% endblock %}
{% block body %}
<div class="panel" style="max-width:760px">
  <form method="get" class="mb-3"><select class="form-select" name="subject" onchange="this.form.submit()"><option value="">Choose subject</option>{% for row in subjects %}<option value="{{ row.pk }}" {% if subject.pk == row.pk %}selected{% endif %}>{{ row }}</option>{% endfor %}</select></form>
  {% if subject %}<form method="post">{% csrf_token %}<input type="hidden" name="subject" value="{{ subject.pk }}">{% include "includes/form_fields.html" %}<button class="btn btn-primary">Save</button></form>{% endif %}
</div>
{% endblock %}
