{% extends "base.html" %}
{% block title %}Page not found · {{ school_name }}{% endblock %}
{% block body %}
  <main id="main" class="auth-screen">
    <section class="auth-card">
      <h1>Page not found</h1>
      <p>That address is not part of this school system.</p>
      {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'dashboard' %}">Back to your dashboard</a>
      {% else %}
        <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
      {% endif %}
    </section>
  </main>
{% endblock %}
