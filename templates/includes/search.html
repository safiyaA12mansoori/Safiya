<form method="get" class="search-form" role="search">
  <label class="visually-hidden" for="list-search">Search</label>
  <input id="list-search" class="form-control" type="search" name="q" value="{{ query }}" placeholder="{{ search_placeholder|default:'Search' }}">
  <button class="btn btn-outline-primary" type="submit">Search</button>
  {% if query %}<a class="btn btn-link" href="{{ request.path }}">Clear</a>{% endif %}
</form>
