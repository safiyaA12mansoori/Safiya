{% extends "base.html" %}
{% block title %}Access denied · {{ school_name }}{% endblock %}
{% block body %}
  <main id="main" class="auth-screen">
    <section class="auth-card">
      <h1>Access denied</h1>
      <p>Your account cannot open this page.</p>
      {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'dashboard' %}">Back to your dashboard</a>
      {% else %}
        <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
      {% endif %}
    </section>
  </main>
{% endblock %}
